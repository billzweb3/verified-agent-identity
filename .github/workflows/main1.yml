name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent name'
        required: true
        default: 'Billz'
      agent_description:
        description: 'Agent description'
        required: true
        default: 'Billz AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ← updated to latest

      - name: Setup Node.js
        uses: actions/setup-node@v4   # ← updated to latest
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: ./scripts
        run: npm install   # or npm ci if you have a package-lock.json

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "\( {{ inputs.agent_name }}", "description": " \){{ inputs.agent_description }}"}'
